name: Smoke Test

on:
  pull_request:
  workflow_dispatch:
    inputs:
      netdisco_git_url:
        description: 'Netdisco source repo (HTTPS git URL)'
        type: string
        default: 'https://github.com/netdisco/netdisco.git'
      committish:
        description: 'Branch / tag / SHA to build'
        type: string
        default: 'HEAD'

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      registry:
        image: registry:3
        ports: ["5000:5000"]
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Resolve build args
        id: args
        run: |
          echo "URL=${{ github.event.inputs.netdisco_git_url || 'https://github.com/netdisco/netdisco.git' }}" >> "$GITHUB_OUTPUT"
          echo "COMMITTISH=${{ github.event.inputs.committish || 'HEAD' }}" >> "$GITHUB_OUTPUT"

      - name: Build images with Bake and Cache
        uses: docker/bake-action@v7.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMITTISH: ${{ steps.args.outputs.committish }}
        with:
          files: compose.build.yaml
          targets: |
            netdisco-postgresql
            netdisco-backend
            netdisco-web
          push: false
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
            *.args.NETDISCO_GIT_URL=${{ steps.args.outputs.url }}
            *.args.COMMITTISH=${{ steps.args.outputs.committish }}

      - name: Verify image is OpenShift / arbitrary-UID compatible
        run: |
          set -e
          # Run perl through the localenv wrapper as a UID outside the image's
          # netdisco user range — same failure mode as OpenShift restricted-v2
          # SCC. local::lib must be able to bootstrap (i.e. /home/netdisco
          # has to be writable for supplemental gid 0).
          for tag in ${{ steps.args.outputs.committish }}-backend ${{ steps.args.outputs.committish }}-web; do
            echo "::group::arbitrary UID test: netdisco/netdisco:$tag"
            docker run --rm --user 1000050000 \
              --entrypoint /home/netdisco/bin/localenv \
              "netdisco/netdisco:$tag" \
              perl -e 'print "ok\n"'
            echo "::endgroup::"
          done

      - name: Prepare host directories
        run: |
          mkdir -p netdisco/logs netdisco/config netdisco/nd-site-local
          sudo chown -R 901:901 netdisco

      - name: Start the stack
        run: docker compose up --detach

      - name: Wait for netdisco-web to respond
        run: |
          set -e
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/ || true)
            echo "[$i] HTTP $code"
            if [ -n "$code" ] && [ "$code" -lt 500 ] && [ "$code" -ne 000 ]; then
              echo "netdisco-web responded with $code after ${i}s"
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for netdisco-web"
          exit 1

      - name: Confirm logs reach docker stdout
        run: |
          for svc in netdisco-backend netdisco-web; do
            lines=$(docker compose logs --no-color --no-log-prefix "$svc" | wc -l)
            echo "$svc: $lines log lines on stdout"
            if [ "$lines" -lt 1 ]; then
              echo "FAIL: $svc produced no stdout logs"
              exit 1
            fi
          done

      - name: Dump compose logs
        if: always()
        run: docker compose logs --no-color || true

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans || true
