name: Smoke Test

on:
  pull_request:
  workflow_dispatch:
    inputs:
      netdisco_git_url:
        description: 'Netdisco source repo (HTTPS git URL)'
        type: string
        default: 'https://github.com/netdisco/netdisco.git'
      committish:
        description: 'Branch / tag / SHA to build'
        type: string
        default: 'HEAD'

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve build args
        id: args
        run: |
          echo "url=${{ github.event.inputs.netdisco_git_url || 'https://github.com/netdisco/netdisco.git' }}" >> "$GITHUB_OUTPUT"
          echo "committish=${{ github.event.inputs.committish || 'HEAD' }}" >> "$GITHUB_OUTPUT"

      - name: Build images
        env:
          NETDISCO_GIT_URL: ${{ steps.args.outputs.url }}
          COMMITTISH: ${{ steps.args.outputs.committish }}
        run: |
          docker compose -f compose.build.yaml build \
            --build-arg "NETDISCO_GIT_URL=${NETDISCO_GIT_URL}" \
            --build-arg "COMMITTISH=${COMMITTISH}" \
            netdisco-postgresql netdisco-base netdisco-backend netdisco-web

      - name: Verify image is OpenShift / arbitrary-UID compatible
        run: |
          set -e
          # Run perl through the localenv wrapper as a UID outside the image's
          # netdisco user range — same failure mode as OpenShift restricted-v2
          # SCC. local::lib must be able to bootstrap (i.e. /home/netdisco
          # has to be writable for supplemental gid 0).
          for tag in latest-base latest-backend latest-web; do
            echo "::group::arbitrary UID test: netdisco/netdisco:$tag"
            docker run --rm --user 1000050000 \
              --entrypoint /home/netdisco/bin/localenv \
              "netdisco/netdisco:$tag" \
              perl -e 'print "ok\n"'
            echo "::endgroup::"
          done

      - name: Prepare host directories
        run: |
          mkdir -p netdisco/config netdisco/nd-site-local
          sudo chown -R 901:901 netdisco

      - name: Start the stack
        run: docker compose up --detach

      - name: Wait for netdisco-web to respond
        run: |
          set -e
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/ || true)
            echo "[$i] HTTP $code"
            if [ -n "$code" ] && [ "$code" -lt 500 ] && [ "$code" -ne 000 ]; then
              echo "netdisco-web responded with $code after ${i}s"
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for netdisco-web"
          exit 1

      - name: Confirm logs reach docker stdout
        run: |
          for svc in netdisco-backend netdisco-web; do
            lines=$(docker compose logs --no-color --no-log-prefix "$svc" | wc -l)
            echo "$svc: $lines log lines on stdout"
            if [ "$lines" -lt 1 ]; then
              echo "FAIL: $svc produced no stdout logs"
              exit 1
            fi
          done

      - name: Confirm no real log files written (foreground mode)
        run: |
          # Post netdisco/netdisco#1500: foreground mode skips log file
          # creation entirely. The Dockerfile keeps the legacy
          # /home/netdisco/logs/netdisco-*.log -> /dev/stdout symlinks as a
          # safety net for non-foreground use, so '-type f' excludes those
          # and only catches *real* files (which would mean log writes
          # accumulating inside the container instead of reaching stdout).
          fail=0
          for svc in netdisco-backend netdisco-web; do
            real=$(docker compose exec -T "$svc" find /home/netdisco/logs \
              -maxdepth 1 -type f -name '*.log' 2>/dev/null || true)
            if [ -n "$real" ]; then
              echo "FAIL: $svc has real log files (expected stdout only):"
              echo "$real"
              fail=1
            else
              echo "OK: $svc — no real .log files in /home/netdisco/logs/"
            fi
          done
          exit $fail

      - name: Dump compose logs
        if: always()
        run: docker compose logs --no-color || true

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans || true
